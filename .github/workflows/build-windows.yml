name: Build Windows installer

# Every push builds and tests the Windows app (downloadable as a workflow
# artifact for collaborators). Pushing a tag like v0.1.0 also publishes a
# public GitHub Release with the installer and the portable exe.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # needed to create the release for v* tags

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pyinstaller pillow

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; else v="0.1.0-dev.${GITHUB_RUN_NUMBER}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build portable exe (single file)
        run: python tools/build_desktop.py

      - name: Smoke test the portable exe starts
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\Foscount.exe -PassThru
          Start-Sleep -Seconds 25
          if ($p.HasExited) { throw "Foscount.exe exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          Rename-Item dist\Foscount.exe "Foscount-portable-${{ steps.ver.outputs.version }}.exe"

      - name: Build folder version for the installer
        run: python tools/build_desktop.py --folder

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DMyAppVersion=${{ steps.ver.outputs.version }}" installer\foscount.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-ChildItem dist\*.exe | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: Foscount-windows-${{ steps.ver.outputs.version }}
          path: dist/*.exe
          retention-days: 90

      - name: Publish GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Foscount ${{ steps.ver.outputs.version }}
          files: |
            dist/*.exe
            docs/Foscount-Read-First.pdf
          body: |
            **Download for Windows 10/11 (64-bit):**
            - `Foscount-Setup-${{ steps.ver.outputs.version }}.exe`: installer (Start menu and desktop shortcut, no administrator rights needed). Recommended.
            - `Foscount-portable-${{ steps.ver.outputs.version }}.exe`: single file that runs without installing (starts more slowly).

            - `Foscount-Read-First.pdf`: short install guide and first-count walkthrough.

            Windows SmartScreen may warn because the app is not code-signed: click **More info → Run anyway**.
