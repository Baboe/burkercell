[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "foscount"
version = "0.1.0"
description = "Foscount: automatic cell counting in Bürker chamber microscope photos (desktop app)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "opencv-python-headless>=4.8",
    "numpy>=1.24",
    "scipy>=1.10",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pyinstaller>=6"]

[project.gui-scripts]
foscount = "foscount.gui.app:main"

[tool.setuptools.packages.find]
include = ["foscount*"]

[tool.setuptools.package-data]
foscount = ["assets/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
